<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Antigravity × MegaDaemon</title>
<!--
  COCKPIT DE ANTIGRAVITY (MEDIDO 2026-11-27).

  POR QUÉ EXISTE
  -------------
  La UI que trae Antigravity (el VS Code fork de Google) es la que el jefe
  llama "infumable": el desplegable de modelo ("Gemini 3 Next Low") no hace
  nada útil, el chat se cuelga sin streaming y los errores salen como un
  bloque de texto con tres niveles mezclados y texto corrupto.

  Ésta es la NUESTRA.  Requisitos que cumple (medidos, no opinions):

    (a) STREAMING de verdad: el texto llega por trozos (evento SSE `token`)
        y se ve progresivo en el móvil.  Antes: una espera sin fin.
    (b) SELECTOR DE MODELO que REALMENTE cambia el backend: el `value` del
        `<select>` es el ID del proveedor y se manda en el POST; el daemon
        responde con el proveedor REAL y la UI lo enseña ("respondió X").
        Antes: un desplegable decorativo.
    (c) RECONEXIÓN AUTOMÁTICA sin perder el hilo: si el stream se corta a
        mitad, se reintenta con backoff y se reenvía el MISMO prompt; el
        hilo (el turno del usuario y el del agente) se conserva en memoria y
        se manda con cada intento.
    (d) LOS 3 NIVELES DE ERROR EN UNA LÍNEA: la barra de estado muestra
        "LLM local OK | cuota: 0 en pausa | prompt 12000/16000 chars".
        Debajo, una ficha por nivel con el detalle.
    (e) NADA DE TEXTO CORRUPTO: todo en español, `lang="es"`, UTF-8, y sin
        misturar idiomas en los mensajes del sistema.

  Autenticación (igual que cockpit_v2.html):
    1) API key en X-API-Key (fuera de loopback) → POST /api/session/exchange
       → token de sesión → X-Seere-Auth-Token.
    2) El token ROTA en cada reinicio del daemon ⇒ no se cachea nada
       (± el sessionStorage del navegador).
-->
<style>
  :root{
    --bg:#0b0e17; --card:#121726; --card2:#0f1420; --edge:#243044;
    --txt:#e8eef7; --txt2:#9fb0c8; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
    --accent:#38bdf8;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f8fc; --card:#ffffff; --card2:#f0f4fa; --edge:#d7e0ee;
           --txt:#0f172a; --txt2:#516079; --ok:#059669; --warn:#b45309;
           --bad:#dc2626; --accent:#0284c7; }
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
  body{ display:flex; flex-direction:column; height:100dvh; overflow:hidden; }

  header{ display:flex; align-items:center; gap:10px; padding:10px 12px;
    border-bottom:1px solid var(--edge); background:var(--card); flex:0 0 auto; }
  .brand{ font-weight:700; font-size:15px; letter-spacing:.2px; }
  .brand b{ color:var(--accent); }
  .spacer{ flex:1; }

  /* ── (d) LA LÍNEA DE ESTADO: los 3 niveles de error, en una línea ── */
  .linea{ display:flex; align-items:center; gap:8px; padding:7px 12px;
    font-size:12px; border-bottom:1px solid var(--edge); background:var(--card2);
    flex:0 0 auto; overflow-x:auto; white-space:nowrap; }
  .nivel{ display:inline-flex; align-items:center; gap:5px; padding:2px 8px;
    border-radius:999px; border:1px solid var(--edge); font-size:11px; }
  .nivel.ok{ color:var(--ok); border-color:var(--ok); }
  .nivel.warn{ color:var(--warn); border-color:var(--warn); }
  .nivel.bad{ color:var(--bad); border-color:var(--bad); }
  .nivel .pt{ width:7px; height:7px; border-radius:50%; background:currentColor; }

  main{ flex:1; min-height:0; overflow-y:auto; padding:12px;
    display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }

  .msg{ border:1px solid var(--edge); border-radius:12px; padding:10px 12px;
    background:var(--card); max-width:100%; overflow-wrap:anywhere; }
  .msg.user{ background:var(--card2); }
  .msg .quien{ font-size:10px; text-transform:uppercase; letter-spacing:.8px;
    color:var(--txt2); margin-bottom:5px; }
  .msg .cuerpo{ white-space:pre-wrap; font-size:14.5px; line-height:1.5; }
  .msg .meta{ margin-top:8px; font-size:11px; color:var(--txt2);
    border-top:1px solid var(--edge); padding-top:6px; }
  .msg .meta code{ background:var(--card2); padding:1px 5px; border-radius:5px; }
  .msg.error{ border-color:var(--bad); }
  .msg.error .cuerpo{ color:var(--bad); }

  .vacio{ margin:auto; text-align:center; color:var(--txt2); font-size:13px;
    line-height:1.7; padding:20px; }

  footer{ flex:0 0 auto; border-top:1px solid var(--edge); background:var(--card);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }
  .fila{ display:flex; gap:8px; align-items:flex-end; }
  select,textarea,button{ font:inherit; font-size:14px; color:var(--txt);
    background:var(--card2); border:1px solid var(--edge); border-radius:10px;
    padding:9px 10px; }
  textarea{ flex:1; resize:none; min-height:44px; max-height:140px; line-height:1.45; }
  select{ max-width:48%; }
  button{ cursor:pointer; font-weight:600; }
  button.primary{ background:var(--accent); color:#04121c; border-color:transparent; }
  button.ghost{ background:transparent; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .barra{ display:flex; gap:8px; align-items:center; margin-top:8px; font-size:11px;
    color:var(--txt2); }
  .barra select{ flex:1; max-width:none; font-size:12px; padding:6px 8px; }
  .detalle{ margin-top:6px; font-size:11px; color:var(--txt2); }
  .detalle summary{ cursor:pointer; }
  pre{ white-space:pre-wrap; word-break:break-word; margin:6px 0 0; font-size:11px;
    background:var(--card2); padding:8px; border-radius:8px; max-height:220px;
    overflow:auto; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>

<header>
  <div class="brand">Antigravity <b>× MegaDaemon</b></div>
  <div class="spacer"></div>
  <span id="chip-modelo" class="nivel ok"><span class="pt"></span><span>—</span></span>
</header>

<!-- (d) Los 3 niveles de error del jefe, en UNA línea legible. -->
<div class="linea" id="linea-estado">
  <span class="nivel" id="niv-unreachable"><span class="pt"></span><span>comprobando…</span></span>
  <span class="nivel" id="niv-cuota"><span class="pt"></span><span>comprobando…</span></span>
  <span class="nivel" id="niv-prompt"><span class="pt"></span><span>comprobando…</span></span>
</div>

<main id="hilo">
  <div class="vacio" id="vacio">
    Escribe abajo y el texto llega por trozos.<br />
    El selector de modelo <b>sí</b> cambia el backend: abajo se ve con quién respondió.
  </div>
</main>

<footer>
  <div class="fila">
    <textarea id="prompt" rows="1" placeholder="¿Qué quieres que haga? (Enter envía, Shift+Enter salta de línea)"></textarea>
    <button class="primary" id="enviar" type="button">Enviar</button>
  </div>
  <div class="barra">
    <label class="sr" for="modelo">Modelo del backend</label>
    <select id="modelo" title="Modelo (backend real)"><option value="local-seere">cargando modelos…</option></select>
    <button class="ghost" id="reintentar" type="button" hidden>Reintentar</button>
    <button class="ghost" id="cancelar" type="button" hidden>Cancelar</button>
  </div>
  <details class="detalle" id="detalle-estado">
    <summary>Estado del daemon (detalle)</summary>
    <pre id="estado-json">—</pre>
  </details>
</footer>

<script>
"use strict";
/* ── Estado ─────────────────────────────────────────────────────────────── */
const state = {
  token: (window.MEGADAEMON_TOKEN || ""),
  apiKey: localStorage.getItem("md_api_key") || "",
  hilo: [],              // (c) el hilo NO se pierde: se conserva y se reenvía
  ctrl: null,            // AbortController del stream en curso
  ultimo: null,          // último prompt enviado (para "Reintentar")
  envioEnCurso: false,
};

/* ── Utilidades ─────────────────────────────────────────────────────────── */
const $ = (s) => document.querySelector(s);
function esc(v){ return String(v == null ? "" : v)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function cabeceras(){
  const h = { "Content-Type": "application/json" };
  if (state.apiKey) h["X-API-Key"] = state.apiKey;
  if (state.token) h["X-Seere-Auth-Token"] = state.token;
  return h;
}

/* Si el daemon reinició, el token de sesión está caducado (401): se pide la
   API key una vez y se canjea por un token nuevo. */
async function recuperarToken(){
  if (!state.apiKey) return false;
  try{
    const r = await fetch("/api/session/exchange", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "X-API-Key": state.apiKey },
      body: JSON.stringify({ api_key: state.apiKey })
    });
    const d = await r.json();
    if (d && d.ok === true && typeof d.token === "string" && d.token.length >= 16){
      state.token = d.token;
      sessionStorage.setItem("md_token", d.token);
      return true;
    }
  }catch(e){ /* sin red: se reintenta luego */ }
  return false;
}

/* ── (b) El selector de modelo: la lista REAL de proveedores ───────────── */
async function cargarModelos(){
  const sel = $("#modelo");
  let items = [];
  try{
    const r = await fetch("/api/antigravity/modelos", { headers: cabeceras() });
    if (r.status === 401 && await recuperarToken()){
      return cargarModelos();
    }
    const d = await r.json();
    items = (d && Array.isArray(d.modelos)) ? d.modelos : [];
  }catch(e){
    sel.innerHTML = '<option value="local-seere">SEERE local (sin lista de modelos)</option>';
    return;
  }
  if (!items.length){
    sel.innerHTML = '<option value="local-seere">SEERE local (sin proveedores listos)</option>';
    return;
  }
  // El `value` es el ID del proveedor: es lo que el daemon entiende.
  sel.innerHTML = items.map(m =>
    '<option value="' + esc(m.id) + '">' + esc(m.name || m.id) +
    (m.model ? " · " + esc(m.model) : "") + '</option>'
  ).join("");
  sel.value = "local-seere";
  if (sel.selectedIndex < 0) sel.selectedIndex = 0;
  pintarModelo();
}

/* Lo que el usuario elige se ve EN CABECERA: así se nota que el desplegable
   no es decorativo. */
function pintarModelo(){
  const sel = $("#modelo");
  const op = sel.options[sel.selectedIndex];
  $("#chip-modelo").innerHTML =
    '<span class="pt"></span><span>' + esc(op ? op.textContent : "—") + '</span>';
}

/* ── (d) La línea de estado: los 3 niveles de error ────────────────────── */
function nivel(el, ok, texto){
  el.className = "nivel " + (ok ? "ok" : "bad");
  el.innerHTML = '<span class="pt"></span><span>' + esc(texto) + '</span>';
}
async function refrescarEstado(){
  try{
    const r = await fetch("/api/antigravity/diagnostico", { headers: cabeceras() });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const nv = d.niveles || {};
    const u = nv.unreachable || {}, c = nv.cuota || {}, p = nv.prompt || {};
    nivel($("#niv-unreachable"), u.ok === true,
      u.ok === true ? "LLM local OK" : "LLM local CAÍDO (" + (u.direccion || "?") + ")");
    nivel($("#niv-cuota"), c.ok === true,
      c.ok === true ? "cuota OK" : "cuota: " + (c.en_pausa || []).length + " en pausa");
    nivel($("#niv-prompt"), p.ok !== false,
      "prompt " + (p.presupuesto || "?") + "/" + (p.limite || "?") + " chars");
    $("#estado-json").textContent = JSON.stringify(d, null, 2);
  }catch(e){
    nivel($("#niv-unreachable"), false, "daemon sin respuesta");
    nivel($("#niv-cuota"), false, "estado desconocido");
    nivel($("#niv-prompt"), false, "estado desconocido");
  }
}

/* ── (c) El hilo ────────────────────────────────────────────────────────── */
function pintarHilo(){
  const h = $("#hilo");
  $("#vacio") && h.removeChild($("#vacio"));
  h.innerHTML = state.hilo.map(m =>
    '<div class="msg ' + (m.rol === "user" ? "user" : "") + (m.error ? " error" : "") + '">' +
      '<div class="quien">' + esc(m.quien || (m.rol === "user" ? "Tú" : "Agente")) + '</div>' +
      '<div class="cuerpo" id="' + esc(m.id || "") + '">' + esc(m.texto || "") + '</div>' +
      (m.meta ? '<div class="meta">' + m.meta + '</div>' : '') +
    '</div>'
  ).join("");
  h.scrollTop = h.scrollHeight;
}
let seq = 0;
function anade(rol, texto, meta, error){
  const id = "m" + (++seq);
  state.hilo.push({ rol: rol, texto: texto, id: id, meta: meta || "", error: !!error });
  pintarHilo();
  return id;
}
function actualiza(id, texto){
  const m = state.hilo.find(x => x.id === id);
  if (m){ m.texto = texto; }
  const el = document.getElementById(id);
  if (el) el.textContent = texto;
  const h = $("#hilo");
  h.scrollTop = h.scrollHeight;
}

/* ── (a) El stream: una llamada, respuesta por trozos ───────────────────── */
function parseFrame(frame){
  let evento = "message", datos = "";
  const lineas = frame.split("\n");
  for (const l of lineas){
    if (l.startsWith("event:")) evento = l.slice(6).trim();
    else if (l.startsWith("data:")) datos += l.slice(5).trim();
  }
  if (!datos) return null;
  try{ return { evento: evento, datos: JSON.parse(datos) }; }
  catch(e){ return null; }
}

async function stream(prompt, modelo, idBurbuja){
  const ctrl = new AbortController();
  state.ctrl = ctrl;
  const r = await fetch("/api/antigravity/stream", {
    method: "POST",
    headers: cabeceras(),
    body: JSON.stringify({ prompt: prompt, model: modelo, hilo: state.hilo }),
    signal: ctrl.signal
  });
  if (r.status === 401 && await recuperarToken()){
    return stream(prompt, modelo, idBurbuja);
  }
  if (!r.ok || !r.body) throw new Error("HTTP " + r.status);
  const lector = r.body.getReader();
  const dec = new TextDecoder("utf-8");
  let buf = "", fin = null, texto = "";
  for(;;){
    const paso = await lector.read();
    if (paso.done) break;
    buf += dec.decode(paso.value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0){
      const ev = parseFrame(buf.slice(0, i));
      buf = buf.slice(i + 2);
      if (!ev) continue;
      if (ev.evento === "token"){
        texto += ev.datos.t || "";
        actualiza(idBurbuja, texto);
      } else if (ev.evento === "fin"){
        fin = ev.datos;
      }
    }
  }
  return fin;
}

/* (c) Reintento con backoff: si el stream se corta, se reenvía el MISMO
   prompt.  El hilo se conserva, así que no se pierde nada. */
async function enviarConReintento(prompt, modelo){
  const idBurbuja = anade("agente", "");
  let intento = 0;
  const MAX = 4;
  while (intento < MAX){
    if (state.envioEnCurso === false && intento > 0){ /* se reintenta */ }
    try{
      // Al reintentar se limpia la burbuja: el proveedor devuelve la
      // respuesta COMPLETA, y concatenar las dos daría el texto duplicado.
      actualiza(idBurbuja, "");
      const fin = await stream(prompt, modelo, idBurbuja);
      if (fin && fin.ok === false){
        actualiza(idBurbuja, "ERROR: " + (fin.error || "sin detalle"));
        const m = state.hilo.find(x => x.id === idBurbuja);
        if (m) m.error = true;
        pintarHilo();
        return;
      }
      if (!fin){
        // El stream se cortó SIN evento de cierre ⇒ reconexión.
        throw new Error("el stream se cortó a mitad");
      }
      // Metadatos: quién respondió DE VERDAD (prueba de que el selector
      // de modelo cambia el backend) y por qué terminó.
      const real = fin.provider_name || fin.provider_id || "?";
      let meta = "Respondió <code>" + esc(real) + "</code>";
      if (fin.provider_id && fin.provider_name && fin.provider_id !== fin.provider_name)
        meta += " (<code>" + esc(fin.provider_id) + "</code>)";
      if (fin.finish_reason && fin.finish_reason !== "stop" && fin.finish_reason !== "STOP")
        meta += " · <b>fin: " + esc(fin.finish_reason) + "</b> (respuesta cortada)";
      if (fin.fallback_used) meta += " · <b>sustituido</b> (se pidió " +
        esc($("#modelo").value) + " y contestó otro)";
      if (fin.tokens) meta += " · " + fin.tokens + " tokens";
      if (fin.latency_ms) meta += " · " + Math.round(fin.latency_ms) + " ms";
      meta += '<details><summary>traza de proveedores</summary><pre>' +
        esc((fin.provider_trace || []).join("\n")) + '</pre></details>';
      const m = state.hilo.find(x => x.id === idBurbuja);
      if (m) m.meta = meta;
      pintarHilo();
      refrescarEstado();
      return;
    }catch(e){
      if (e && e.name === "AbortError"){
        actualiza(idBurbuja, "cancelado");
        const m = state.hilo.find(x => x.id === idBurbuja);
        if (m) m.error = true;
        pintarHilo();
        return;
      }
      intento++;
      if (intento >= MAX){
        actualiza(idBurbuja, "ERROR: sin respuesta (" + (e.message || e) + ")");
        const m = state.hilo.find(x => x.id === idBurbuja);
        if (m) m.error = true;
        pintarHilo();
        return;
      }
      const espera = Math.min(8000, 1000 * Math.pow(2, intento - 1));
      const aviso = anade("sistema",
        "Se cortó la conexión (" + (e.message || e) + "). Reintento " +
        intento + "/" + MAX + " en " + Math.round(espera / 1000) + " s.");
      void aviso;
      await sleep(espera);
      const m = state.hilo.find(x => x.id === idBurbuja);
      if (m) m.texto = "";
      pintarHilo();
    }
  }
}

/* ── Acciones ───────────────────────────────────────────────────────────── */
async function enviar(){
  if (state.envioEnCurso) return;
  const caja = $("#prompt");
  const texto = caja.value.trim();
  if (!texto) return;
  state.ultimo = texto;
  caja.value = "";
  caja.style.height = "auto";
  anade("user", texto);
  state.envioEnCurso = true;
  $("#enviar").disabled = true;
  $("#cancelar").hidden = false;
  $("#reintentar").hidden = true;
  try{
    await enviarConReintento(texto, $("#modelo").value);
  }finally{
    state.envioEnCurso = false;
    $("#enviar").disabled = false;
    $("#cancelar").hidden = true;
    $("#reintentar").hidden = false;
  }
}

/* ── Arranque ───────────────────────────────────────────────────────────── */
$("#enviar").addEventListener("click", enviar);
$("#cancelar").addEventListener("click", () => { if (state.ctrl) state.ctrl.abort(); });
$("#reintentar").addEventListener("click", () => {
  if (!state.ultimo) return;
  const t = state.ultimo;
  state.ultimo = null;
  $("#prompt").value = t;
  enviar();
});
$("#modelo").addEventListener("change", pintarModelo);
$("#prompt").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); enviar(); }
});
$("#prompt").addEventListener("input", (ev) => {
  ev.target.style.height = "auto";
  ev.target.style.height = Math.min(140, ev.target.scrollHeight) + "px";
});

// Si el daemon reinició, el token inyectado puede estar caducado: se
// canjea por uno nuevo con la API key guardada.
(async function(){
  if (state.token && state.token.length >= 16){ /* vale */ }
  else if (state.apiKey){ await recuperarToken(); }
  await Promise.all([ cargarModelos(), refrescarEstado() ]);
  setInterval(refrescarEstado, 15000);
})();
</script>
</body>
</html>
