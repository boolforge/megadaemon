name: megadaemon-build

# Objetivo: cada commit a `main` produce (1) un binario ARM64 para Android
# (el móvil S21 Ultra = instancia MAESTRA), (2) binarios Linux x86_64/ARM64
# para el PC del usuario (instancia WORKER), y (3) un artefacto de release
# con el que la instancia se auto-actualiza sin intervención manual.
#
# Regla dura del proyecto: nunca `push --force`, nunca reescribir `main`.

on:
  push:
    # `main` y `v14-coordination`: la rama v14 lleva el fix de autenticación
    # del navegador local (exención por Host + token incrustado + multi-clave),
    # que es el que hace que la UI del móvil funcione sola. El binario ARM64
    # que se despliega en el Samsung se saca de ahí.
    branches: [main, v14-coordination]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: megadaemon-${{ github.ref }}
  # NO cancelar el build en curso: cada push cancelaba el run anterior y el
  # binario ARM64 no se publicaba nunca.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # GATE DE SINTAXIS (2026-11-22): parsea cada .rs con rustfmt ANTES de
  # compilar.  Detecta en SEGUNDOS los merges que concatenan texto (main se
  # rompio dos veces por eso: un delimitador sin cerrar y un '<' en el
  # nombre de un test) y NO se come la RAM del runner.
  # Es un gate de SINTAXIS, no de formato.
  sintaxis:
    name: sintaxis (rustfmt, sin compilar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parsear cada .rs
        run: bash tools/check-sintaxis.sh

  quality:
    name: calidad (fmt + clippy + tests)
    runs-on: ubuntu-latest
    # MEDIDO el 2026-11-22: este job era el ÚNICO sin los overrides de release
    # => compilaba la suite con LTO + codegen-units=1 => el rustc lo MATABAN
    # por OOM en el runner (señal 9) => "la suite falló pero no se pudo
    # identificar el binario" => **el gate era inútil**.  Los jobs build-*
    # ya los tenían; aquí se pone lo mismo (a nivel de job, para que affects
    # también al clippy, que compila --all-targets en release).
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      # Sin color en el log: el gate lo analiza con grep/awk (y así el log que
      # se descarga para diagnosticar es legible).
      CARGO_TERM_COLOR: "never"
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
      - name: Formato
        working-directory: rust-core
        run: cargo fmt --check || echo "::warning::cargo fmt --check falló (no bloquea)"
      - name: Clippy (advertencias como aviso, no bloquea)
        working-directory: rust-core
        run: cargo clippy --release --all-targets -- -D warnings || echo "::warning::clippy reportó avisos"
      - name: "Tests del crate COMPARTIDO de redaccion (fuera del workspace)"
        # MEDIDO (2026-11-23): `crates/redact` no pertenece al workspace del
        # daemon => sus tests NUNCA se ejecutaban en el CI, y su bug (en
        # texto plano `password=` no se redactaba) llego al payload.
        run: cargo test --manifest-path crates/redact/Cargo.toml --lib
      - name: "Tests: la suite completa (los rojos CONOCIDOS no bloquean; los demás, sí)"
        # AUDIT-CI-02 (medido el 2026-11-21): antes esto era
        # `cargo test --all-targets || echo warning`, es decir, `continue-on-error`
        # => el job salía VERDE con cualquier test roto.  Llevaba tiempo así:
        # tres tests de `agent_loop` estaban rojos (contradecían a la
        # implementación) y nadie se enteró.
        #
        # Ahora `tools/ci-suite.sh` ejecuta la suite completa y falla si hay
        # un binario rojo que NO esté en `tools/ci-known-red.txt`.  Sólo
        # `audit_adversarial_v15` está en esa lista: son auditorías que
        # fallan a propósito mientras el defecto que vigilan exista.
        run: tools/ci-suite.sh rust-core
      - name: "Gate (BLOQUEA): autenticacion y politica del harness"
        working-directory: rust-core
        # Este gate SI bloquea el job `quality`: protege el dispositivo.
        # - `api_key::`  = el gate de acceso (401/403/429) del cockpit.
        # - `harness_policy` = que exige `confirm` una escritura peligrosa.
        # Los tests de la auditoria adversarial (audit_adversarial_v15) NO
        # bloquean a proposito: fallan mientras el defecto exista, y su red
        # es la que manda el orden de trabajo.
        run: |
          env -u MEGADAEMON_API_KEY -u MEGADAEMON_TOKEN -u SEERE_AUTH_TOKEN \
            cargo test --release --lib api_key::
          env -u MEGADAEMON_API_KEY -u MEGADAEMON_TOKEN -u SEERE_AUTH_TOKEN \
            cargo test --release --test harness_policy
      - name: "Gate (BLOQUEA): higiene de modulos (los merges en masa rompian main)"
        # MEDIDO 3 veces el 2026-11-21: un merge de flota dejo `pub mod peers;`
        # y `pub mod backup_ab;` DECLARADOS DOS VECES (E0428) y `store_manager`
        # sin declarar (E0433) => la lib no compilaba => los 4 jobs del CI en
        # rojo => NINGUN ARM64 publicado (10 h sin binario).  Estas tres
        # comprobaciones son deterministas, cuestan un segundo y cortan esa
        # clase de fallo ANTES de gastar 20 minutos de runner.
        run: |
          set -u
          fail=0
          echo "--- 1) modulos declarados mas de una vez en lib.rs ---"
          dups=$(grep -E '^\s*(pub\s+)?mod\s+[a-z_0-9]+\s*;' rust-core/src/lib.rs \
                 | sed -E 's/.*mod\s+([a-z_0-9]+).*/\1/' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::modulos declarados mas de una vez: $(echo "$dups" | tr '\n' ' ')"
            fail=1
          else
            echo "OK: ninguna declaracion duplicada"
          fi
          echo "--- 2) modulos .rs sin declarar en lib.rs (E0583) ---"
          missing=""
          for f in rust-core/src/*.rs; do
            b=$(basename "$f" .rs)
            [ "$b" = "lib" ] && continue
            [ "$b" = "main" ] && continue
            grep -qE "^\s*(pub\s+)?mod\s+$b\s*;" rust-core/src/lib.rs || missing="$missing $b"
          done
          if [ -n "$missing" ]; then
            echo "::error::modulos sin declarar en lib.rs:$missing"
            fail=1
          else
            echo "OK: todos los modulos estan declarados"
          fi
          echo "--- 3) el workflow es YAML valido (si no, GitHub lo RECHAZA entero) ---"
          python3 tools/yaml_lint.py .github/workflows/*.yml || fail=1
          [ "$fail" = 0 ] || exit 1
          echo "higiene de modulos OK"

  build-android:
    name: build ARM64 (Android / NDK)
    runs-on: ubuntu-latest
    # Sin `needs: quality`: un test rojo de otro módulo NO debe bloquear el
    # artefacto ARM64 que usa la instancia maestra. La calidad se informa aparte.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, aarch64-unknown-linux-gnu
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
            crates/hooks-payload/target
          key: cargo-android-${{ hashFiles('rust-core/Cargo.lock') }}
      # MEDIDO (2026-11-24): el payload de frida-gum se compila AQUI, con el
      # MISMO NDK y el MISMO target que el daemon, y se EMBARDA en el binario
      # (una sola build, un solo artefacto: el movil no tiene que bajarlo de
      # un Release aparte).  Sigue siendo un `cdylib` (tiene que ser un .so
      # aparte para dlopen en otro proceso), pero el ARTEFACTO que baja el
      # movil es UNO.
      - name: "Dependencias de gum (bindgen necesita libclang; los shims en C, el clang del NDK)"
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang
          clang --version | head -1
      - name: "Compilar el payload (gum) para incrustarlo"
        working-directory: crates/hooks-payload
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          # El payload es un cdylib PEQUEÑO que va embebido en el daemon:
          # se deja con LTO desactivado (es el camino ya verificado) porque
          # su tamaño es irrelevante frente al binario principal.
          #
          # MEDIDO 2026-11-25: el comentario va ANTES del bloque plegado
          # (`>-`) a propósito: tras un bloque literal tiene que venir una
          # CLAVE, y `tools/yaml_lint.py` (el gate del CI) rechaza un
          # comentario ahí ("línea fuera del bloque literal con sangría
          # incorrecta") ⇒ el workflow entero se rechazaba.
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            -I${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
            -I${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android
            -I${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android/api-level-26
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          # MEDIDO (2026-11-26): el path del payload era `../rust-core/dist`
          # DESDE `crates/hooks-payload` ⇒ apuntaba a `crates/rust-core/dist`
          # (que no existe) ⇒ el payload NUNCA llegaba al `dist/` real y el
          # release no lo publicaba.  Ahora es una ruta ABSOLUTA.
          DIST: ${{ github.workspace }}/rust-core/dist
        run: |
          cargo build --release --target aarch64-linux-android
          mkdir -p "$DIST"
          cp target/aarch64-linux-android/release/libhooks_payload.so "$DIST/hooks-payload-arm64"
          # MEDIDO (2026-11-26, CI): el `.sha256` se generaba con la ruta
          # ABSOLUTA (`/home/runner/work/.../rust-core/dist/hooks-payload-arm64`)
          # ⇒ en el job `release` `sha256sum -c` buscaba ESA ruta (que allí no
          # existe) y fallaba => NO se publicaba ninguna release.  Se genera
          # con el NOMBRE (no con la ruta absoluta) ⇒ portable entre jobs.
          ( cd "$DIST" && sha256sum hooks-payload-arm64 > hooks-payload-arm64.sha256 )
          file "$DIST/hooks-payload-arm64" | tee /tmp/fichero-payload.txt
          grep -q "ELF 64-bit LSB shared object" /tmp/fichero-payload.txt || {
            echo "::error::el payload no es una shared object ELF 64-bit"; exit 1; }
          grep -q "ARM aarch64" /tmp/fichero-payload.txt || {
            echo "::error::el payload no es ARM aarch64"; exit 1; }
      - name: Compilar
        working-directory: rust-core
        env:
          # El commit se EMBEBE en el binario: /health publica build.short y
          # asi se puede comprobar desde fuera qué build sirve el movil.
          MEGADAEMON_BUILD_SHA: ${{ github.sha }}
          # El payload de frida-gum EMBEBIDO (una sola build).
          MEGADAEMON_PAYLOAD_PATH: ${{ github.workspace }}/crates/hooks-payload/target/aarch64-linux-android/release/libhooks_payload.so
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          # El NDK r26c NO trae 'aarch64-linux-android-ar' ni su ranlib =>
          # cc-rs aborta si no se le pasan llvm-ar/llvm-ranlib.
          RANLIB_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          # El perfil release por defecto (lto=true "fat", codegen-units=1)
          # MATA al rustc por OOM (SIGKILL) en el runner: el crate es grande.
          # MEDIDO 2026-11-25 (tamaño): con `LTO=false` el asset ARM64 pesaba
          # 47.191.040 B (45,0 MB).  LTO "thin" da casi todo el ahorro del
          # "fat" con una fracción de la RAM ⇒ el binario baja de tamaño sin
          # volver a morir.  `codegen-units=16` es para las DEPENDENCIAS; el
          # crate principal baja a 4 por el override de `package` en
          # Cargo.toml (1 lo mata, 16 infla el binario).
          CARGO_PROFILE_RELEASE_LTO: "thin"
          # MEDIDO 2026-11-25: CU=16 para las DEPENDENCIAS infla el binario
          # (con CU=4 el enlazador elimina el codigo muerto de verdad).
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: |
          cargo build --release --target aarch64-linux-android
          mkdir -p dist
          # El nucleo forense en C (26 KB, sin dependencias): se compila con el
          # clang del NDK que ya esta aqui, y se publica CON sha256 para que
          # el movil lo verifique.  Es lo que puede diagnosticar al daemon
          # CUANDO el daemon esta roto (no depende de la libreria de Rust).
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" \
            -O2 -Wall -o dist/mddoctor-android-arm64 "$GITHUB_WORKSPACE/tools/mddoctor.c"
          chmod 755 dist/mddoctor-android-arm64
          sha256sum dist/mddoctor-android-arm64 > dist/mddoctor-android-arm64.sha256
          cp dist/mddoctor-android-arm64 dist/mddoctor-android-arm64-${GITHUB_SHA::7}
          sha256sum dist/mddoctor-android-arm64-${GITHUB_SHA::7} > dist/mddoctor-android-arm64-${GITHUB_SHA::7}.sha256
          cp target/aarch64-linux-android/release/megadaemon-core dist/megadaemon-core-android-arm64
          sha256sum dist/megadaemon-core-android-arm64 > dist/megadaemon-core-android-arm64.sha256
          # Copia VERSIONADA (mismo motivo que en el build de Linux): en el
          # móvil el binario se identifies por su sha corto, no por un
          # "megadaemon-core" sobrescrito a pelo.
          cp dist/megadaemon-core-android-arm64 dist/megadaemon-core-android-arm64-${GITHUB_SHA::7}
          sha256sum dist/megadaemon-core-android-arm64-${GITHUB_SHA::7} > dist/megadaemon-core-android-arm64-${GITHUB_SHA::7}.sha256
          # Binarios AUXILIARES del movil.  `cargo build` sin --bin ya los
          # compila todos; faltaba publicarlos.  Son imprescindible para la
          # autocuracion: `channel-publish` es el que SONDEA el tunel (el
          # movil no tiene curl) y el que publica el estado del canal; sin
          # el, la recuperacion se queda a medias.
          # `md-clipboard` (portapapeles) y `md-dict` (diccionarios) son
          # CLIs que se ejecutan en el movil: sin publicarlos no llegan al
          # dispositivo.
          #
          # `md-inject` es el INYECTOR ptrace: sin el no hay forma de cargar
          # el payload de hooks (frida-gum) en el proceso de Antigravity
          # (MEDIDO 2026-11-26, movil: el movil NO tiene frida-server
          # arrancado ni cliente `frida`, y el payload va incrustado en el
          # daemon ⇒ el inyector es el UNICO cargador posible).
          for aux in channel-publish duckdns-updater md-lan-listen npu-probe md-clipboard md-dict md-inject; do
            if [ -f "target/aarch64-linux-android/release/$aux" ]; then
              cp "target/aarch64-linux-android/release/$aux" "dist/$aux-arm64"
              sha256sum "dist/$aux-arm64" > "dist/$aux-arm64.sha256"
              echo "  dist/$aux-arm64"
            fi
          done
      - name: "Tamano del binario (medido, para comparar builds)"
        # MEDIDO 2026-11-25: el usuario pidio Explicitamente "optimizar mucho
        # el tamano final del binario sin perder capacidades".  Sin medicion
        # no hay forma de saber si un cambio ayuda.  Se publica el tamano de
        # CADA asset en el resumen del job (legible sin permisos de admin) y
        # como aviso en el log.
        run: |
          set -u
          { echo ""; echo "| asset | bytes | MiB |"; echo "|---|---|---|"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" 2>/dev/null || true
          for f in dist/*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256|*.json) continue;; esac
            b=$(stat -c %s "$f")
            m=$(awk -v b="$b" 'BEGIN{printf "%.2f", b/1048576}')
            echo "::notice::$(basename "$f") = $b bytes ($m MiB)"
            { echo "| $(basename "$f") | $b | $m |"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" 2>/dev/null || true
          done
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: megadaemon-android-arm64
          path: rust-core/dist/
          retention-days: 30

  build-linux:
    name: build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Igual que build-android: los binarios de los workers no dependen del verde
    # de los tests de la rama.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: megadaemon-core-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            asset: megadaemon-core-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-linux-${{ matrix.target }}-${{ hashFiles('rust-core/Cargo.lock') }}
      - name: Instalar cross-linker (ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Compilar
        working-directory: rust-core
        env:
          MEGADAEMON_BUILD_SHA: ${{ github.sha }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          RANLIB_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ranlib
          # Perfil release sin LTO: con lto=true, codegen-units=1 el rustc
          # muere por OOM en el runner (SIGKILL) y el build aarch64 cae.
          # MEDIDO 2026-11-25: LTO "thin" (mismo criterio que el ARM64):
          # el asset publicado tiene que llevar la misma politica que el
          # de Android, y "thin" da casi todo el ahorro del "fat" sin
          # matar al rustc por OOM.
          CARGO_PROFILE_RELEASE_LTO: "thin"
          # MEDIDO 2026-11-25: CU=16 para las DEPENDENCIAS infla el binario
          # (con CU=4 el enlazador elimina el codigo muerto de verdad).
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/megadaemon-core dist/${{ matrix.asset }}
          sha256sum dist/${{ matrix.asset }} > dist/${{ matrix.asset }}.sha256
          # Copia VERSIONADA: al desplegar en el móvil el binario no debe
          # sobrescribir "megadaemon-core" a pelo (los .bak han confundido a
          # dos agentes). Con el nombre versionado se sabe de un vistazo qué
          # build está en el dispositivo.
          cp dist/${{ matrix.asset }} dist/${{ matrix.asset }}-${GITHUB_SHA::7}
          sha256sum dist/${{ matrix.asset }}-${GITHUB_SHA::7} > dist/${{ matrix.asset }}-${GITHUB_SHA::7}.sha256
      - name: "Tamano del binario (medido, para comparar builds)"
        # MEDIDO 2026-11-25: el usuario pidio Explicitamente "optimizar mucho
        # el tamano final del binario sin perder capacidades".  Sin medicion
        # no hay forma de saber si un cambio ayuda.  Se publica el tamano de
        # CADA asset en el resumen del job (legible sin permisos de admin) y
        # como aviso en el log.
        run: |
          set -u
          { echo ""; echo "| asset | bytes | MiB |"; echo "|---|---|---|"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" 2>/dev/null || true
          for f in dist/*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256|*.json) continue;; esac
            b=$(stat -c %s "$f")
            m=$(awk -v b="$b" 'BEGIN{printf "%.2f", b/1048576}')
            echo "::notice::$(basename "$f") = $b bytes ($m MiB)"
            { echo "| $(basename "$f") | $b | $m |"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" 2>/dev/null || true
          done
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: megadaemon-${{ matrix.asset }}
          path: rust-core/dist/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # PAYLOAD DE HOOKS (frida-gum) — ARM64 Android
  # ---------------------------------------------------------------------------
  # (El payload de frida-gum ya NO tiene build propio: se compila en el job
  # de Android y va EMBEBIDO en el daemon.  Ver "build-android".)
  #
  # bindings OFICIALES de Frida en Rust (frida-gum).  Vive FUERA del crate
  # del daemon a propósito: el binario principal no puede depender de gum,
  # de bindgen (libclang) ni del devkit de Frida => el build por defecto
  # (CI, móvil) no se entera.
  #
  # Requisitos de build (medidos el 2026-11-23, ver docs/INYECCION-HOOKS.md):
  #   * `libclang-dev` + `clang`: frida-gum-sys usa BINDGEN 0.72.1 para
  #     generar los bindings a gum.h.
  #   * el clang del NDK (CC_aarch64_linux_android): frida-gum-sys compila
  #     con `cc` los shims en C (invocation_listener.c, probe_listener.c).
  #   * RED: con la feature `auto-download`, frida-build descarga el devkit
  #     PRECOMPILADO `frida-gum-devkit-17.9.5-android-arm64.tar.xz` (9,5 MB)
  #     del release de Frida 17.9.5 (el que fija frida-gum-sys/FRIDA_VERSION)
  #     => NO hacen falta meson ni ninja (gum no se compila: se enlaza el
  #     `libfrida-gum.a` del devkit).
  #   * el linker del NDK: aarch64-linux-android26-clang.
  # Tests del payload en el HOST (x86_64): validan la redacción de
  # credenciales y el escritor NDJSON SIN tocar el móvil.  Es un job aparte
  # (no bloquea la release) porque el payload es accesorio.
  hooks-payload-test:
    name: tests del payload (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "Dependencias de gum (bindgen necesita libclang)"
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang
      - name: Tests
        working-directory: crates/hooks-payload
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo test --release

  # MEDIDO (2026-11-26, movil): el LS de Antigravity NO usa la libc de
  # Bionic: corre con un runtime de GLIBC propio
  # (/data/user/0/com.agy/files/runtime/lib/libc.so.6).  Un payload enlazado
  # contra Bionic (NEEDED libc.so / libdl.so / liblog.so) NO se puede cargar
  # ahi: el enlazador de glibc no encuentra esas librerias y la carga aborta
  # con "cannot locate symbol g_get_tmp_dir" (el crate frida-gum usa la API
  # de glib en Android y la de gum en Linux).  Por eso hace falta una SEGUNDA
  # variante del payload, enlazada contra glibc.
  #
  # Es un job APARTE: si gum no llegara a compilarse para glibc, el movil
  # sigue teniendo daemon y el payload de Bionic (el release sale igual).
  build-hooks-payload-glibc:
    name: payload de hooks para GLIBC (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Dependencias (cross-gcc para glibc; libclang para bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libclang-dev clang
          aarch64-linux-gnu-gcc --version | head -1
      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/hooks-payload/target
          key: cargo-payload-glibc-${{ hashFiles('crates/hooks-payload/Cargo.lock') }}
      - name: "Compilar el payload (gum) para GLIBC (aarch64-unknown-linux-gnu)"
        working-directory: crates/hooks-payload
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          RANLIB_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ranlib
          # El devkit de gum (17.9.5) lo baja el propio build.rs: para este
          # target pide `frida-gum-devkit-17.9.5-linux-arm64.tar.xz` (existe
          # en el release de Frida).  El sysroot es el del cross-gcc, para
          # que bindgen encuentre los headers de glibc.
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu: >-
            --sysroot=/usr/aarch64-linux-gnu
            -I/usr/aarch64-linux-gnu/include
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          # MEDIDO (2026-11-26): `../dist` desde `crates/hooks-payload` es
          # `crates/dist` y el `upload-artifact` subia el `dist/` del REPO
          # (que esta versionado en git) => el artefacto no llevaba el
          # payload y el release no lo publicaba.  Ahora: ruta ABSOLUTA y
          # directorio PROPIO.
          DIST: ${{ github.workspace }}/dist-glibc
          # `$ORIGIN`: el payload busca sus propias dependencias en el
          # directorio donde vive (el daemon copia ahi la `libgcc_s.so.1`
          # del runtime del LS).  MEDIDO (2026-11-26, movil): el proceso del
          # LS NO tiene DT_RPATH ni DT_RUNPATH (su `--library-path` es de
          # glibc y no se traduce a un RPATH del ELF).
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
            -C link-arg=-Wl,-rpath,$ORIGIN
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
          mkdir -p "$DIST"
          cp target/aarch64-unknown-linux-gnu/release/libhooks_payload.so "$DIST/hooks-payload-linux-arm64"
          # MEDIDO (2026-11-26, CI): `.sha256` con el NOMBRE (no con la ruta
          # absoluta) ⇒ portable entre jobs.  Ver el mismo comentario en el
          # job de Android.
          ( cd "$DIST" && sha256sum hooks-payload-linux-arm64 > hooks-payload-linux-arm64.sha256 )
          file "$DIST/hooks-payload-linux-arm64" | tee /tmp/fichero-payload-glibc.txt
          grep -q "ELF 64-bit LSB shared object" /tmp/fichero-payload-glibc.txt || {
            echo "::error::el payload glibc no es una shared object ELF 64-bit"; exit 1; }
          readelf -d "$DIST/hooks-payload-linux-arm64" | tee /tmp/necesarias-glibc.txt
          grep -q "libc.so.6" /tmp/necesarias-glibc.txt || {
            echo "::error::el payload glibc no depende de libc.so.6"; exit 1; }
          # MEDIDO (2026-11-26, movil): el runtime del LS tiene mapeadas
          # libc.so.6, libm.so.6, libdl.so.2, libpthread.so.0, libresolv.so.2
          # y librt.so.1.  El payload NO puede depender de nada mas.
          # `libgcc_s.so.1` SI puede: esta en el runtime del LS
          # (/data/user/0/com.agy/files/runtime/lib) y el daemon la copia
          # junto al payload, que la busca con $ORIGIN.
          for lib in liblog.so libstdc++.so libelf.so.1; do
            if grep -q "$lib" /tmp/necesarias-glibc.txt; then
              echo "::error::el payload glibc depende de $lib (no lo tiene el runtime del LS)"; exit 1
            fi
          done
          grep -q "RPATH\|RUNPATH" /tmp/necesarias-glibc.txt || {
            echo "::error::el payload glibc no tiene RUNPATH (\$ORIGIN)"; exit 1; }
          echo "payload de glibc compilado y verificado"
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: hooks-payload-glibc
          path: ${{ github.workspace }}/dist-glibc/


  release:
    name: release (auto-actualización de las instancias)
    runs-on: ubuntu-latest
    # (si no, el asset del payload a veces no llega a tiempo al release), pero
    # el `if: always()` de abajo hace que su fallo NO tumbe la release: el
    # móvil no puede quedarse sin daemon porque el payload no compile.
    needs: [build-android, build-linux, build-hooks-payload-glibc]
    # Publica en CUALQUIER rama (main y v14-coordination): el tag es v<sha>, así
    # que no chocan entre ramas y el binario ARM64 sale siempre con nombre
    # versionado.
    #
    # v16 · `always()` + `needs.build-android.result == 'success'`: el móvil
    # es la instancia MAESTRA y su binario es el que se despliega; una pata
    # Linux rota (aarch64 en un runner x86, p.ej. por el RANLIB) NO puede
    # tumbar la release del ARM64.  Medido: el job ARM64 compilaba bien y la
    # release se saltaba porque `needs` exigia las dos patas.
    if: always() && github.event_name == 'push' && needs.build-android.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: "Verificar assets (el ARM64 es OBLIGATORIO: es la instancia maestra)"
        # Sin esta puerta, un build de Linux roto publicaba una release SIN el
        # binario de Android (medido: releases con `adbonly-arm64` y nada más)
        # y el manifiesto `latest.json` prometía assets inexistentes => la
        # instancia se quedaba sin poder actualizar.  Aquí: si falta el ARM64
        # => NO hay release y NO hay manifiesto.
        run: |
          set -u
          falta=0
          for a in megadaemon-core-android-arm64 \
                   megadaemon-core-android-arm64.sha256 \
                   "megadaemon-core-android-arm64-${GITHUB_SHA::7}" \
                   "megadaemon-core-android-arm64-${GITHUB_SHA::7}.sha256"; do
            if [ ! -f "dist/$a" ]; then echo "::error::FALTA el asset obligatorio dist/$a"; falta=1; fi
          done
          if [ "$falta" = 1 ]; then
            echo "::error::sin release: la instancia maestra se quedaria sin binario"
            exit 1
          fi
          file dist/megadaemon-core-android-arm64 | grep -q "ELF 64-bit LSB.*ARM aarch64" || {
            echo "::error::dist/megadaemon-core-android-arm64 no es un ELF aarch64"; exit 1; }
          # El manifiesto .sha256 se genera desde la RAÍZ del repo
          # (`sha256sum dist/<asset> > dist/<asset>.sha256`) ⇒ la ruta que
          # contiene lleva el prefijo `dist/`.  Verificar desde dentro de
          # dist/ hacía que sha256sum buscase `dist/dist/<asset>` y el job
          # fallaba con "No such file or directory" => sin release => el móvil
          # sin binario.  Se verifica DESDE LA RAÍZ.
          sha256sum -c dist/megadaemon-core-android-arm64.sha256 || exit 1
          sha256sum -c "dist/megadaemon-core-android-arm64-${GITHUB_SHA::7}.sha256" || exit 1
          echo "assets ARM64 verificados ✓"
          # Verificar el VALOR del sha256, NO la ruta.
          #
          # MEDIDO (2026-11-26, CI): el `.sha256` del payload lo genera el job
          # que lo compila, en SU directorio ⇒ la ruta que contiene no existe
          # en este job (`/home/runner/work/.../rust-core/dist/…`) y
          # `sha256sum -c` fallaba con "No such file or directory" => el job
          # `release` caía => NO se publicaba NINGUNA release (el móvil se
          # quedaba sin binario).  Aquí se compara el VALOR del hash.
          verificar_sha() {
            local f="$1" esperado real
            esperado=$(cut -d' ' -f1 < "$f.sha256")
            real=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$esperado" != "$real" ]; then
              echo "::error::sha256 incorrecto en $f (esperado $esperado, real $real)"
              exit 1
            fi
          }
          # El PAYLOAD DE HOOKS es opcional: si su job falló, la release sale
          # igual (el móvil no se queda sin daemon por culpa del payload) pero
          # sin el asset del payload.  Si está, se verifica su sha256.
          if [ -f dist/hooks-payload-arm64 ]; then
            if [ ! -f dist/hooks-payload-arm64.sha256 ]; then
              echo "::error::falta dist/hooks-payload-arm64.sha256"; exit 1
            fi
            verificar_sha dist/hooks-payload-arm64
            echo "payload de hooks verificado ✓"
          else
            echo "::notice::el payload de hooks NO se publica en este run (job 'build-hooks-payload' falló o no se ejecutó)"
          fi
          # El payload de GLIBC (para el LS de Antigravity, que corre con un
          # runtime de glibc) es opcional por el mismo motivo.
          if [ -f dist/hooks-payload-linux-arm64 ]; then
            if [ ! -f dist/hooks-payload-linux-arm64.sha256 ]; then
              echo "::error::falta dist/hooks-payload-linux-arm64.sha256"; exit 1
            fi
            verificar_sha dist/hooks-payload-linux-arm64
            echo "payload de hooks (glibc) verificado ✓"
          else
            echo "::notice::el payload de hooks para glibc NO se publica en este run"
          fi
      - name: "Build META: bundle con TODO dentro (binario + stack + manifiesto)"
        # El bundle meta es la via de instalacion/actualizacion COMPLETA: un
        # unico .tar.gz con el binario, el supervisor, el keeper, los scripts
        # de Antigravity y la Web UI, y un manifest.json con el SHA-256 de
        # CADA fichero.  El daemon lo descarga, lo verifica fichero a
        # fichero y lo instala (`megadaemon-core bundle --instalar`).
        # La autorreparacion offline la hace el modulo `stack` (el binario
        # lleva el stack dentro).
        run: |
          set -u
          chmod +x tools/construir-bundle.sh
          tools/construir-bundle.sh dist/megadaemon-core-android-arm64 dist/megadaemon-movil.tar.gz
          echo "--- contenido del bundle:"
          tar -tzf dist/megadaemon-movil.tar.gz | sort
          # El manifiesto debe estar dentro y listar los 10 ficheros.
          python3 - <<'PY2'
          import json, tarfile, sys
          with tarfile.open("dist/megadaemon-movil.tar.gz", "r:gz") as t:
              man = json.load(t.extractfile("manifest.json"))
          n = len(man["ficheros"])
          print(f"   manifiesto: {n} ficheros, build {man['build']}")
          if n < 10:
              print("::error::el bundle no trae todos los ficheros del stack")
              sys.exit(1)
          for f in man["ficheros"]:
              if len(f["sha256"]) != 64:
                  print(f"::error::sha invalido para {f['origen']}")
                  sys.exit(1)
          PY2
          sha256sum dist/megadaemon-movil.tar.gz > dist/megadaemon-movil.tar.gz.sha256
          echo "bundle verificado ✓"
      - name: Publicar el estado del release (manifiesto con SÓLO los assets que existen)
        # El manifiesto se genera DINÁMICO: si una pata de Linux falló, su
        # asset NO aparece en `latest.json` (antes siempre aparecía => la
        # instancia pedía un fichero inexistente).
        #
        # POR QUÉ EL PAYLOAD DE HOOKS NO ENTRA EN `latest.json`:
        # `latest.json` es el manifiesto del BINARIO del daemon.  El móvil se
        # autoactualiza comparando `version` y bajando el asset que corresponde
        # a SU plataforma (`assets`/`assets_versioned`).  El payload es otro
        # artefacto, con su propio ciclo: la tool `hooks_payload` lo baja del
        # último release (`hooks-payload-arm64`), verifica su sha256 y lo
        # reinstala cuando hace falta.  Meterlo aquí daría la falsa impresión
        # de que "el daemon se ha actualizado" cuando lo único que cambió fue
        # el payload, y haría que el daemon se autoactualizara sin motivo
        # (gaste de datos y reinicio del servicio en el móvil).
        run: |
          mkdir -p dist/state
          python3 - <<'PY'
          import json, os, datetime
          sha = os.environ["GITHUB_SHA"]; short = sha[:7]
          def has(n): return os.path.isfile(os.path.join("dist", n))
          assets, versioned = {}, {}
          for key, base in (("android-arm64", "megadaemon-core-android-arm64"),
                            ("linux-x86_64", "megadaemon-core-linux-x86_64"),
                            ("linux-arm64", "megadaemon-core-linux-arm64")):
              if has(base):
                  assets[key] = base
                  v = f"{base}-{short}"
                  if has(v): versioned[key] = v
          man = {"version": sha, "short": short,
                 "ref": os.environ.get("GITHUB_REF_NAME", ""),
                 "released_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "assets": assets, "assets_versioned": versioned}
          with open("dist/state/latest.json", "w") as fh:
              json.dump(man, fh, indent=2)
          print(json.dumps(man, indent=2))
          PY
      - name: Publicar artefactos como release (tag v<commit>)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: true
          generate_release_notes: true
          tag_name: v${{ github.sha }}
      - name: Subir el manifiesto de actualización
        uses: actions/upload-artifact@v4
        with:
          name: megadaemon-latest-manifest
          path: dist/state/latest.json
          retention-days: 90
