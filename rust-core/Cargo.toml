[package]
name = "megadaemon-core"
version = "13.4.0"
edition = "2021"
authors = ["MegaDaemon Engineering Team <megadaemon@agy.internal>"]
description = "MegaDaemon v13.0 Zenith — Pure Rust Multi-OS RE Workbench (DiE, Binwalk, Tile Molester, ImHex/Kaitai, CIRX v3.4 SSA, MBA, Rizin/Frida, Exynos NPU/CV, Parasitic LLM Swarm & Antigravity MCP Server)"

[dependencies]
# KDF del motor de backup: **Argon2id** (RFC 9106), el mismo KDF que mide
# Swift Backup. `default-features = false` + `alloc` deja fuera `password-hash`
# y `rand` => **cero dependencias de entropía del sistema** (Android no siempre
# expone /dev/urandom al proceso) y binario más pequeño para ARM64.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64ct = { version = "1", features = ["alloc"] }   # base64 de la clave publica (SPKI)
flate2 = "1"           # inflate (entradas deflate de los ZIP/APK)
libc = "0.2"
memmap2 = "0.9"
rsa = { version = "0.9", features = ["pem"] }
rusqlite = { version = "0.32", features = ["bundled"] }  # SQLite nativo: navegadores, gestores, Telegram, SMS
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = { version = "0.10", features = ["oid"] }  # feature oid: AssociatedOid para RSA PKCS#1 v1.5
sha2 = "0.10"          # SHA-256 nativo (inventario de APK, dedup, firmados)
ureq = { version = "3.5.2", features = ["rustls", "json"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }  # lectura de APK/DEX
# zstd: contenedor TAR+zstd (el interior de Swift Backup) y el nuestro.
#
# `default-features = false` + `arrays` => **NO** se activan `bindgen` (exige
# libclang en el NDK) ni `pkg-config` (exige libzstd del sistema). El crate
# `zstd-sys` compila el **C de zstd embebido** y lo enlaza estático ⇒ el
# binario ARM64 no depende de ninguna libzstd del sistema (Android no trae
# ninguna). Mismo mecanismo que el SQLite `bundled` de arriba.
zstd = { version = "0.13", default-features = false, features = ["arrays"] }

[features]

default = []
# Servidor SSH nativo (russh). Sólo Linux/Android-ARM64: el PC Linux es su
# destino natural; en el móvil queda opcional por peso de compilación.
ssh = ["dep:russh", "dep:tokio", "dep:tokio-rustls", "dep:rustls"]

[dependencies.russh]
version = "0.49"
optional = true

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "net", "io-util", "macros", "time"]
optional = true

[dependencies.tokio-rustls]
version = "0.26"
optional = true
features = ["ring"]

[dependencies.rustls]
version = "0.23"
optional = true
default-features = false
features = ["ring", "std", "tls12"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# v15: SIN panic="abort" a propósito.
#
# Con panic="abort", CUALQUIER panic (por ejemplo un `lock().unwrap()` sobre
# un mutex envenenado por otro panic) mata el PROCESO ENTERO.  El daemon es
# el origen del túnel de Cloudflare: si muere, el túnel devuelve 502/530 y el
# móvil parece "caído" sin estarlo (medido el 2026-11-20: el OOM killer se
# llevó cloudflared dos veces y el daemon una).
# Sin abort, el panic se queda en la conexión que lo provocó y el daemon
# sigue sirviendo.  Además es lo que hace que `catch_unwind` (usado en las
# herramientas de análisis) pueda cumplir su papel.
strip = true
