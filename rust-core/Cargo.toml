[package]
name = "megadaemon-core"
version = "13.4.0"
edition = "2021"
authors = ["MegaDaemon Engineering Team <megadaemon@agy.internal>"]
description = "MegaDaemon v13.0 Zenith — Pure Rust Multi-OS RE Workbench (DiE, Binwalk, Tile Molester, ImHex/Kaitai, CIRX v3.4 SSA, MBA, Rizin/Frida, Exynos NPU/CV, Parasitic LLM Swarm & Antigravity MCP Server)"

# El build script COMPRIME el payload de frida-gum antes de incrustarlo.
# MEDIDO (2026-11-25): el payload son 3.269.720 B (3,12 MiB = 7,6 % del
# binario del daemon) y comprime a 1.054.700 B con xz -9 (zstd -19 da algo
# mas, ~1,2 MiB, y descomprime en microsegundos).  Al incrustar el
# COMPRIMIDO y descomprimir al instalar, el binario del movil pierde ~2 MiB
# sin perder ninguna capacidad.
[build-dependencies]
zstd = { version = "0.13", default-features = false, features = ["arrays"] }

[dependencies]
# **ACP (Agent Client Protocol)**: esquema canónico de la industria para
# que un editor hable con un agente. MEDIDO (2026-11-27):
#   * crate `agent-client-protocol-schema` v1.22.0, **Apache-2.0**, del repo
#     canónico `agentclientprotocol/agent-client-protocol` (149 ficheros en
#     `src/v1/` + `src/v2/`);
#   * el registro oficial prueba **42 agentes**: 41 inicializan y **los 41 son
#     `protocolVersion: 1`** => v2 (el de Devin) todavia no es widespread;
#   * `sessionStop` no lo implementa **nadie** (0/41).
# `default-features = false` => fuera `schemars` (que solo implementa
# `JsonSchema` y pesa); `unstable_protocol_v2` es opt-in explicito.
agent-client-protocol-schema = { version = "1.22", default-features = false }
# Política de redacción de credenciales: **fuente única** compartida con el
# payload de hooks que se inyecta en el móvil (`crates/injector-payload`).
# Sin dependencias externas (ver `crates/redact/Cargo.toml`).
megadaemon-redact = { path = "../crates/redact" }
# KDF del motor de backup: **Argon2id** (RFC 9106), el mismo KDF que mide
# Swift Backup. `default-features = false` + `alloc` deja fuera `password-hash`
# y `rand` => **cero dependencias de entropía del sistema** (Android no siempre
# expone /dev/urandom al proceso) y binario más pequeño para ARM64.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64ct = { version = "1", features = ["alloc"] }   # base64 de la clave publica (SPKI)
flate2 = "1"           # inflate (entradas deflate de los ZIP/APK)
libc = "0.2"
memmap2 = "0.9"
ring = "0.17"          # Ed25519 (certificado propio) + CSPRNG del canal KDE Connect
rsa = { version = "0.9", features = ["pem"] }
rusqlite = { version = "0.32", features = ["bundled"] }  # SQLite nativo: navegadores, gestores, Telegram, SMS
# TLS del canal KDE Connect.  `rustls` ya estaba en el árbol por `ureq`
# (mismo proveedor `ring`), así que esto NO añade crates nuevos: sólo hace
# el crate accessible directamente.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = { version = "0.10", features = ["oid"] }  # feature oid: AssociatedOid para RSA PKCS#1 v1.5
sha2 = "0.10"          # SHA-256 nativo (inventario de APK, dedup, firmados)
blake3 = "1.8"           # hash mas rapido que SHA-256 para verificar descargas grandes
url = "2.5"              # parseo WHATWG de URLs (validar, normalizar, nombre de fichero)
brotli = "9"             # descompresion de respuestas con Content-Encoding: br
ureq = { version = "3.5.2", features = ["rustls", "json"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }  # lectura de APK/DEX
# zstd: contenedor TAR+zstd (el interior de Swift Backup) y el nuestro.
#
# `default-features = false` + `arrays` => **NO** se activan `bindgen` (exige
# libclang en el NDK) ni `pkg-config` (exige libzstd del sistema). El crate
# `zstd-sys` compila el **C de zstd embebido** y lo enlaza estático ⇒ el
# binario ARM64 no depende de ninguna libzstd del sistema (Android no trae
# ninguna). Mismo mecanismo que el SQLite `bundled` de arriba.
zstd = { version = "0.13", default-features = false, features = ["arrays"] }
# --- Pure-Rust Battle-Tested Reuse Suite (Android ARM64 NDK static-safe) ---
aho-corasick = "1.1"
bzip2 = "0.6"
crc32fast = "1.5"
fatfs = "0.3"
format198x-commodore-amiga-adf = "0.3"
format198x-commodore-c64-d64 = "0.1"
format198x-tzx = "0.1"
go-retool = { path = "../go-retool/crates/go-retool" }
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "pe32", "pe64", "mach32", "mach64", "archive", "endian_fd"] }
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
lzma-rs = "0.3"
memchr = "2.8"
oauth2 = { version = "5.0", default-features = false }
p12-keystore = "0.4"
rdnie = { version = "0.4", default-features = false }
similar = "3.2"
tar = "0.4"
webpki-roots = "1.0"
x509-cert = "0.3"
# --- PoC 2/3/5/6 Ecosystem Expansion (Tree-sitter, Rhai, VT100, DWARF + x86/ARM64 Disasm) ---
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
rhai = { version = "1.20", features = ["sync", "only_i64"] }
vt100 = "0.15"
gimli = "0.31"
addr2line = "0.24"
iced-x86 = "1.21"
capstone = "0.13"
# --- SLEIGH + Retro/Modern Pure-Rust RE Ecosystem ---
wazabin-sleigh = "0.1"
yaxpeax-arch = "0.3"
yaxpeax-x86 = "2.2"
yaxpeax-arm = "0.5"
yaxpeax-mips = "0.1"
yaxpeax-avr = "0.1"
iz80 = "0.5"

[features]

default = []
# Servidor SSH nativo (russh). Sólo Linux/Android-ARM64: el PC Linux es su
# destino natural; en el móvil queda opcional por peso de compilación.
ssh = ["dep:russh", "dep:tokio", "dep:tokio-rustls"]

[dependencies.russh]
version = "0.49"
optional = true

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "net", "io-util", "macros", "time"]
optional = true

[dependencies.tokio-rustls]
version = "0.26"
optional = true
features = ["ring"]

[profile.dev]
debug = "line-tables-only"
codegen-units = 16

[profile.test]
debug = "line-tables-only"
codegen-units = 16

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# v15: SIN panic="abort" a propósito.
#
# Con panic="abort", CUALQUIER panic (por ejemplo un `lock().unwrap()` sobre
# un mutex envenenado por otro panic) mata el PROCESO ENTERO.  El daemon es
# el origen del túnel de Cloudflare: si muere, el túnel devuelve 502/530 y el
# móvil parece "caído" sin estarlo (medido el 2026-11-20: el OOM killer se
# llevó cloudflared dos veces y el daemon una).
# Sin abort, el panic se queda en la conexión que lo provocó y el daemon
# sigue sirviendo.  Además es lo que hace que `catch_unwind` (usado en las
# herramientas de análisis) pueda cumplir su papel.
strip = true

# v16 (2026-11-22): el crate `megadaemon-core` es ENORME (200+ módulos) ⇒ con
# `opt-level=3` el rustc pide ~2,2 GB de RAM y el OOM killer lo mata en
# máquinas de 3 GB (medido 5 SIGKILL seguidos en este sandbox al compilar el
# ARM64). Para ESTE paquete basta `opt-level=1`: su trabajo real es I/O, SHA-256
# y red (no CPU) ⇒ se pierde un % imperceptible y el build entra en un
# contenedor de 3 GB. Los overrides de `package` **no** tocan el perfil de las
# dependencias (siguen compilándose con el perfil base ⇒ no se recalcula nada).
#
# MEDIDO 2026-11-25 (tamaño del binario): `opt-level = 1` era la mayor parte
# del problema.  El asset ARM64 medido pesaba 47.191.040 B (45,0 MB) porque
# el job de Android además DESACTIVABA el LTO (`LTO=false`, CU=16) "por
# OOM".  Con `opt-level = 3` el código se optimiza de verdad y el binario
# baja; `codegen-units = 4` se mantiene (1 lo que mata al rustc, 16 infla el
# binario).  El LTO pasa a "thin" en el workflow: da casi todo el ahorro del
# LTO "fat" con una fracción de la RAM.
[profile.release.package.megadaemon-core]
opt-level = 3
codegen-units = 4
# MEDIDO (2026-11-25, binario publicado): el override de PAQUETE **anula**
# el `strip = true` del perfil base (Cargo no lo hereda aqui).  Sin esta
# linea el binarioPublished llevaba `.symtab` (2.661.408 B) + `.strtab`
# (4.166.193 B) = 6.827.601 B = 6,52 MiB (15,9 % del binario) de tabla de
# simbolos en el movil, que no sirve para nada.
# REPRODUCIDO con un paquete minimo: con el override el binario conserva
# .symtab/.strtab; sin el override desaparecen (362.808 -> 290.944 B).
strip = true
