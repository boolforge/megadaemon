[package]
name = "md-valida-autorreparacion"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
name = "md_valida_autorreparacion"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.dev]
opt-level = 0
debug = 0
incremental = false
codegen-units = 16
